- type: entity
  abstract: true
  parent: [ Clothing, ContentsExplosionResistanceBase ]
  id: ClothingModsuitControlBase
  name: base modsuit control module
  components:
    - type: Sprite
      state: icon #A default state looking for the icon.png in the .rsi, will need to be changed given modsuits currently do not use that as their base
    - type: Clothing
      quickEquip: false
      equipSound: /Audio/Mecha/mechmove03.ogg
      unequipSound: /Audio/Mecha/mechmove03.ogg
      slots: [ back ]
    - type: Storage
      grid:
      - 0,0,2,3
      maxItemSize: Huge
    - type: ContainerContainer
      containers:
        storagebase: !type:Container
          ents: []
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface
    - type: SwitchableEquipMode
    - type: UseDelay
      delay: 0.5
    - type: ExplosionResistance
      damageCoefficient: 0.9
    - type: Tag
      tags:
      - Backpack
      #  - WhitelistChameleon

- type: entity
  parent: [ ClothingModsuitControlBase ]
  id: ClothingModsuitControlSecurity
  name: security modsuit control module
  description: A test version of the security modsuit control module
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/ModsuitControlModules/security-modsuit.rsi
      layers:
        - state: icon-security-control-sealed
    - type: Clothing
      clothingVisuals:
        back:
          - state: security-control-sealed


#################################################################################################
- type: entity
  abstract: true
  id: ModsuitBase
  parent: ClothingBackpack
  components:
    - type: Sprite
      sprite: _Starlight/Clothing/Back/ModsuitControlModules/new-security-modsuit.rsi
      layers:
        - state: icon-control
          map: ["enum.ToggleableVisuals.Enabled"]

    - type: Clothing
      sprite: _Starlight/Clothing/Back/ModsuitControlModules/new-security-modsuit.rsi
      slots:
        - back
      clothingVisuals:
        back:
          - state: equipped-control

    - type: ToggleableVisuals
      spriteLayer: enum.ToggleableVisuals.Layer
      clothingVisuals:
        back:
          - state: equipped-control-sealed

    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.ToggleableVisuals.Enabled:
          emum.ModsuitVisuals.IconLayer:
            True: {state: "icon-control-sealed"}
            False: {state: "icon-control"}

    - type: ContainerContainer
      containers:
        helmet: !type:ContainerSlot { }
        chestplate: !type:ContainerSlot { }
        gauntlets: !type:ContainerSlot { }
        boots: !type:ContainerSlot { }

        storedGauntlets: !type:ContainerSlot { }
        storedBoots: !type:ContainerSlot { }

    - type: Modsuit
      parts:
        Helmet: SecurityModHelmet
        Chestplate: SecurityModChestplate
        Gauntlets: SecurityModGauntlets
        Boots: SecurityModBoots
      actionEndpoints:
        - ActionModsuitWheel
        - ActionModsuitPower

    - type: UserInterface
      interfaces:
        enum.ModsuitUiKey.Radial:
          type: ModsuitMenuUserInterface

####
- type: entity
  id: SecurityModsuit
  parent: ModsuitBase
  name: security modsuit control module new
  description: A new iteration of the test security modsuit control module
  components:
    - type: Clothing
      sprite: _Starlight/Clothing/Back/ModsuitControlModules/new-security-modsuit.rsi
      slots:
        - back
      clothingVisuals:
        back:
          - state: equipped-control

